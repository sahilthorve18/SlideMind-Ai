<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d2340"/>
      <stop offset="100%" stop-color="#061225"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Architectural presentation layers / isometric cube -->
  <g filter="url(#glow)">
    <!-- Top layer -->
    <path d="M32 16 L48 24 L32 32 L16 24 Z" fill="url(#redGlow)" fill-opacity="0.95"/>
    <!-- Bottom layer -->
    <path d="M16 29 L32 37 L48 29 L48 35 L32 43 L16 35 Z" fill="#ffffff" fill-opacity="0.85"/>
    <!-- Deep foundation layer -->
    <path d="M16 39 L32 47 L48 39 L48 42 L32 50 L16 42 Z" fill="url(#redGlow)" fill-opacity="0.5"/>
  </g>
</svg>
