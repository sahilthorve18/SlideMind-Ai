name: Keep Render Backend Awake

on:
  schedule:
    # Run every 5 minutes to stay ahead of Render's 15-minute free-tier inactivity spin-down
    - cron: '*/5 * * * *'
  workflow_dispatch: # Enable manual triggers for on-demand verification

# Prevent overlapping workflow runs if a previous run is still waiting on retries
concurrency:
  group: keep-render-alive
  cancel-in-progress: false

jobs:
  ping-health:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve Target Backend URL
        id: resolve-url
        env:
          INPUT_URL: ${{ secrets.RENDER_BACKEND_URL || vars.RENDER_BACKEND_URL || 'https://slidemind-ai-backend.onrender.com' }}
        run: |
          TARGET_URL="${INPUT_URL%/}"
          if [ -z "$TARGET_URL" ]; then
            echo "::error::Target backend URL is empty."
            exit 1
          fi
          echo "TARGET_URL=${TARGET_URL}" >> $GITHUB_ENV
          echo "Keep-alive target configured: ${TARGET_URL}"

      - name: Send Health Check Ping
        run: |
          ENDPOINT="${TARGET_URL}/api/health"
          echo "=================================================="
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Target endpoint: ${ENDPOINT}"
          echo "=================================================="

          # Ping backend with timeout and retries (Render cold start can take 30-50s)
          HTTP_STATUS=$(curl -s -S -A "SlideMindKeepAlive/1.0" -o response_body.txt -w "%{http_code}" \
            --connect-timeout 25 \
            --max-time 90 \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            "${ENDPOINT}")

          echo "HTTP Status Code: ${HTTP_STATUS}"
          echo "Response Body:"
          cat response_body.txt || true
          echo ""

          if [ "${HTTP_STATUS}" -eq 200 ]; then
            echo "SUCCESS: Backend responded with HTTP 200 OK. Instance is awake and healthy."
            exit 0
          else
            echo "::error::Health check failed! Expected HTTP 200, received HTTP ${HTTP_STATUS}."
            exit 1
          fi
